<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AcademIA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff; color: #000; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; }
    .screen { display: none; padding: 28px 20px 64px; }
    .screen.active { display: block; }

    /* --- Logo --- */
    .logo-wrap { text-align: center; padding: 52px 0 10px; }
    .logo { display: inline-flex; align-items: center; font-size: 46px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; }
    .logo-academ { color: #000; }
    .logo-ia { background: #000; color: #fff; padding: 3px 10px 5px; border-radius: 10px; font-style: italic; letter-spacing: -0.5px; margin-left: 2px; font-size: 44px; }
    .tagline { text-align: center; font-size: 12px; color: #aaa; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 8px; }

    /* --- Date & Days --- */
    .date-display { text-align: center; font-size: 15px; color: #666; font-weight: 500; margin: 28px 0 32px; text-transform: capitalize; }
    .days-section { text-align: center; margin-bottom: 36px; }
    .days-count { font-size: 64px; font-weight: 900; letter-spacing: -3px; line-height: 1; }
    .days-label { font-size: 14px; color: #888; margin-top: 6px; }

    /* --- Workout buttons --- */
    .btn-group { display: flex; gap: 14px; margin-bottom: 16px; }
    .btn-workout-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .suggested-dot { width: 10px; height: 10px; border-radius: 50%; background: #000; visibility: hidden; flex-shrink: 0; }
    .suggested-dot.on { visibility: visible; }
    .btn-workout { width: 100%; padding: 24px 12px 20px; background: #000; color: #fff; border: none; border-radius: 16px; font-size: 20px; font-weight: 800; cursor: pointer; font-family: inherit; letter-spacing: 0.5px; transition: opacity 0.15s; }
    .btn-workout:active { opacity: 0.75; }
    .btn-workout-sub { display: block; font-size: 11px; font-weight: 400; opacity: 0; margin-top: 5px; letter-spacing: 0; }
    .btn-workout-sub.on { opacity: 0.65; }
    .btn-outline { display: block; width: 100%; padding: 14px; background: #fff; color: #000; border: 1.5px solid #000; border-radius: 16px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center; transition: background 0.15s; }
    .btn-outline:active { background: #f0f0f0; }

    /* --- Nav --- */
    .nav-header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .btn-back { background: none; border: 1.5px solid #e0e0e0; border-radius: 10px; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: inherit; transition: background 0.15s; }
    .btn-back:active { background: #f5f5f5; }
    .nav-title { font-size: 24px; font-weight: 800; }

    /* --- Progress --- */
    .progress-wrap { margin-bottom: 24px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: #999; font-weight: 500; margin-bottom: 9px; }
    .progress-bar { height: 5px; background: #eee; border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: #000; border-radius: 10px; width: 0%; transition: width 0.35s cubic-bezier(0.4,0,0.2,1), background 0.4s; }
    .progress-fill.complete { background: #2e7d32; }

    /* ═══════════════════════════════════════════
       EXERCISE CARDS — melhorados
    ═══════════════════════════════════════════ */
    .exercise-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 16px 16px 14px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 22px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
      margin-bottom: 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .exercise-card:active { transform: scale(0.985); box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
    .exercise-card.done {
      background: #f1f9f1;
      border-color: rgba(46,125,50,0.18);
      box-shadow: 0 2px 14px rgba(46,125,50,0.10);
    }

    /* Icon box */
    .ex-icon-wrap { position: relative; flex-shrink: 0; }
    .ex-icon {
      width: 72px; height: 72px;
      background: #f4f4f4;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      padding: 8px;
      transition: background 0.2s;
      overflow: hidden;
    }
    .ex-icon svg { width: 100%; height: 100%; display: block; }
    .exercise-card.done .ex-icon { background: #e6f4e6; }

    /* Number badge */
    .ex-badge {
      position: absolute; top: -6px; left: -6px;
      width: 20px; height: 20px;
      background: #e0e0e0; color: #777;
      font-size: 10px; font-weight: 800;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }
    .exercise-card.done .ex-badge { background: #2e7d32; color: #fff; }

    /* Text content */
    .ex-body { flex: 1; min-width: 0; }
    .ex-muscle {
      font-size: 10px;
      font-weight: 700;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }
    .exercise-card.done .ex-muscle { color: #7cb87c; }
    .ex-name { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 5px; }
    .ex-detail { font-size: 12px; color: #999; line-height: 1.5; }
    .ex-note { font-size: 11px; color: #c0a060; font-weight: 600; margin-top: 4px; }

    /* Check circle */
    .ex-check {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid #ddd; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
      transition: all 0.2s;
    }
    .exercise-card.done .ex-check { background: #000; border-color: #000; color: #fff; }

    /* --- Conclude button --- */
    .btn-conclude { display: block; width: 100%; padding: 18px; background: #000; color: #fff; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; letter-spacing: 0.5px; margin-top: 24px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity 0.35s, transform 0.35s; }
    .btn-conclude.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .btn-conclude:active { opacity: 0.8; }

    /* --- Stats --- */
    .stats-period { font-size: 16px; font-weight: 700; color: #444; margin-bottom: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 28px; }
    .stat-box { border: 1.5px solid #e8e8e8; border-radius: 14px; padding: 16px 8px; text-align: center; }
    .stat-num { font-size: 28px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
    .stat-lbl { font-size: 11px; color: #999; margin-top: 5px; line-height: 1.3; }
    .section-label { font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .card { border: 1.5px solid #e8e8e8; border-radius: 14px; overflow: hidden; margin-bottom: 28px; }
    .week-table { width: 100%; border-collapse: collapse; }
    .week-table th { padding: 10px 14px; font-size: 11px; font-weight: 600; color: #bbb; text-align: left; background: #fafafa; border-bottom: 1px solid #f0f0f0; }
    .week-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #f5f5f5; }
    .week-table tr:last-child td { border-bottom: none; }
    .week-table td:first-child { font-weight: 600; }
    .history-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #f5f5f5; }
    .history-item:last-child { border-bottom: none; }
    .history-date { font-size: 13px; color: #666; flex: 1; text-transform: capitalize; }
    .history-badge { background: #000; color: #fff; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 100px; }
    .history-meta { font-size: 12px; color: #aaa; white-space: nowrap; }
    .empty-state { text-align: center; color: #ccc; font-size: 14px; padding: 36px 16px; }

    /* --- Toast --- */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(12px); background: #111; color: #fff; padding: 13px 24px; border-radius: 100px; font-size: 14px; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; z-index: 1000; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="app">

  <!-- TELA PRINCIPAL -->
  <div class="screen active" id="screen-main">
    <div class="logo-wrap">
      <div class="logo"><span class="logo-academ">Academ</span><span class="logo-ia">IA</span></div>
    </div>
    <div class="tagline">seu treino inteligente</div>
    <div class="date-display" id="main-date"></div>
    <div class="days-section">
      <div class="days-count" id="days-count">0</div>
      <div class="days-label">dias treinados em <span id="main-month"></span></div>
    </div>
    <div class="btn-group">
      <div class="btn-workout-wrapper">
        <div class="suggested-dot" id="dot-a"></div>
        <button class="btn-workout" onclick="startWorkout('A')">TREINO A<span class="btn-workout-sub" id="sub-a">sugerido hoje</span></button>
      </div>
      <div class="btn-workout-wrapper">
        <div class="suggested-dot" id="dot-b"></div>
        <button class="btn-workout" onclick="startWorkout('B')">TREINO B<span class="btn-workout-sub" id="sub-b">sugerido hoje</span></button>
      </div>
    </div>
    <button class="btn-outline" onclick="showScreen('stats')">Ver Estatísticas</button>
  </div>

  <!-- CHECKLIST -->
  <div class="screen" id="screen-checklist">
    <div class="nav-header">
      <button class="btn-back" onclick="showScreen('main')">&#8592;</button>
      <div class="nav-title" id="checklist-title">Treino A</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta"><span id="prog-text">0 de 8 exercícios</span><span id="prog-pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
    <div id="exercise-list"></div>
    <button class="btn-conclude" id="btn-conclude" onclick="concludeWorkout()">CONCLUIR TREINO</button>
  </div>

  <!-- ESTATÍSTICAS -->
  <div class="screen" id="screen-stats">
    <div class="nav-header">
      <button class="btn-back" onclick="showScreen('main')">&#8592;</button>
      <div class="nav-title">Estatísticas</div>
    </div>
    <div class="stats-period" id="stats-period"></div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num" id="s-days">0</div><div class="stat-lbl">Dias treinados</div></div>
      <div class="stat-box"><div class="stat-num" id="s-exs">0</div><div class="stat-lbl">Exercícios feitos</div></div>
      <div class="stat-box"><div class="stat-num" id="s-reps">0</div><div class="stat-lbl">Repetições</div></div>
    </div>
    <div class="section-label">Semana a semana</div>
    <div class="card">
      <table class="week-table">
        <thead><tr><th>Semana</th><th>Dias</th><th>Exerc.</th><th>Reps</th></tr></thead>
        <tbody id="week-tbody"></tbody>
      </table>
    </div>
    <div class="section-label">Histórico recente</div>
    <div class="card" id="history-list"></div>
    <button class="btn-outline" style="margin-top:8px" onclick="showScreen('main')">&#8592; Voltar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

    { name: 'Máquina deltoide ombro',       series: 4, reps: '10-12', load: '20kg (banco alto)' },
    { name: 'Elevação lateral na parede',   series: 4, reps: '10-12', load: '6kg cada lado' },
    { name: 'Rosca barra W',                series: 4, reps: '10-12', load: '15kg' },
    { name: 'Rosca martelo',                series: 4, reps: '10-12', load: '9kg cada lado', note: 'Descanso 1min 30s' },
    { name: 'Abdominal infra c/ caneleira', series: 3, reps: '15',    load: '3kg' },
  ]
};

// ═══════════════════════════════════════════════════════
//  ESTADO
// ═══════════════════════════════════════════════════════
let currentType = 'A';
let checked = [];

// ═══════════════════════════════════════════════════════
//  LOCALSTORAGE
// ═══════════════════════════════════════════════════════
function loadAll() {
  try { return JSON.parse(localStorage.getItem('academia_workouts') || '[]'); } catch { return []; }
}
function saveRecord(rec) {
  const all = loadAll(); all.push(rec);
  localStorage.setItem('academia_workouts', JSON.stringify(all));
}

// ═══════════════════════════════════════════════════════
//  DATAS
// ═══════════════════════════════════════════════════════
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTHS_SHORT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WEEKDAYS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function pad(n) { return String(n).padStart(2,'0'); }
function todayStr() { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function monthPrefix() { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function formatLong(d) { return `${WEEKDAYS[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`; }
function formatShort(str) { const [,m,d]=str.split('-'); return `${parseInt(d)} de ${MONTHS_SHORT[parseInt(m)-1]}`; }
function weekOfMonth(s) { return Math.min(Math.ceil(parseInt(s.split('-')[2])/7),4); }

// ═══════════════════════════════════════════════════════
//  CÁLCULO REPS
// ═══════════════════════════════════════════════════════
function avgReps(str) {
  if (str.includes('-')) { const [lo,hi]=str.split('-').map(Number); return Math.round((lo+hi)/2); }
  return parseInt(str);
}
function totalRepsForWorkout(type) {
  return WORKOUTS[type].reduce((s,ex) => s + ex.series*avgReps(ex.reps), 0);
}

// ═══════════════════════════════════════════════════════
//  NAVEGAÇÃO
// ═══════════════════════════════════════════════════════
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const ids = { main:'screen-main', checklist:'screen-checklist', stats:'screen-stats' };
  document.getElementById(ids[name]).classList.add('active');
  window.scrollTo(0,0);
  if (name==='main') renderMain();
  if (name==='stats') renderStats();
}

// ═══════════════════════════════════════════════════════
//  TELA PRINCIPAL
// ═══════════════════════════════════════════════════════
function renderMain() {
  const now = new Date();
  document.getElementById('main-date').textContent = formatLong(now);
  document.getElementById('main-month').textContent = MONTHS[now.getMonth()].toLowerCase();
  const all = loadAll();
  const mwks = all.filter(w => w.date.startsWith(monthPrefix()));
  document.getElementById('days-count').textContent = new Set(mwks.map(w=>w.date)).size;
  const last = all.length ? all[all.length-1] : null;
  const sug = last ? (last.type==='A' ? 'B' : 'A') : 'A';
  ['a','b'].forEach(t => {
    const on = sug.toLowerCase()===t;
    document.getElementById(`dot-${t}`).classList.toggle('on', on);
    document.getElementById(`sub-${t}`).classList.toggle('on', on);
  });
}

// ═══════════════════════════════════════════════════════
//  CHECKLIST
// ═══════════════════════════════════════════════════════
function startWorkout(type) {
  currentType = type; checked = [];
  document.getElementById('checklist-title').textContent = `Treino ${type}`;
  buildChecklist();
  showScreen('checklist');
}

function buildChecklist() {
  const exercises = WORKOUTS[currentType];
  const list = document.getElementById('exercise-list');
  list.innerHTML = '';

  exercises.forEach((ex, i) => {
    const iconKey = EXERCISE_ICON[currentType][i];
    const icon    = ICONS[iconKey];
    const muscle  = MUSCLE_LABEL[iconKey];

    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.dataset.index = i;
    card.innerHTML = `
      <div class="ex-icon-wrap">
        <div class="ex-icon">${icon}</div>
        <div class="ex-badge">${i+1}</div>
      </div>
      <div class="ex-body">
        <div class="ex-muscle">${muscle}</div>
        <div class="ex-name">${ex.name}</div>
        <div class="ex-detail">${ex.series} séries &times; ${ex.reps} reps &nbsp;&middot;&nbsp; ${ex.load}</div>
        ${ex.note ? `<div class="ex-note">${ex.note}</div>` : ''}
      </div>
      <div class="ex-check"></div>`;
    card.addEventListener('click', () => toggleEx(i));
    list.appendChild(card);
  });

  refreshProgress();
}

function toggleEx(i) {
  const pos = checked.indexOf(i);
  if (pos===-1) checked.push(i); else checked.splice(pos,1);
  const card = document.querySelector(`.exercise-card[data-index="${i}"]`);
  const done = checked.includes(i);
  card.classList.toggle('done', done);
  card.querySelector('.ex-check').innerHTML = done ? '&#10003;' : '';
  refreshProgress();
}

function refreshProgress() {
  const total = WORKOUTS[currentType].length, done = checked.length;
  const pct = Math.round(done/total*100);
  document.getElementById('prog-text').textContent = `${done} de ${total} exercícios`;
  document.getElementById('prog-pct').textContent = `${pct}%`;
  const fill = document.getElementById('prog-fill');
  fill.style.width = pct+'%';
  fill.classList.toggle('complete', done===total);
  document.getElementById('btn-conclude').classList.toggle('visible', done===total);
}

function concludeWorkout() {
  saveRecord({ date: todayStr(), type: currentType, exercisesDone: WORKOUTS[currentType].length, totalReps: totalRepsForWorkout(currentType) });
  showToast(`Treino ${currentType} concluído!`);
  setTimeout(() => showScreen('main'), 1600);
}

// ═══════════════════════════════════════════════════════
//  ESTATÍSTICAS
// ═══════════════════════════════════════════════════════
function renderStats() {
  const now = new Date();
  document.getElementById('stats-period').textContent = `${MONTHS[now.getMonth()]} de ${now.getFullYear()}`;
  const all = loadAll();
  const mwks = all.filter(w => w.date.startsWith(monthPrefix()));
  document.getElementById('s-days').textContent = new Set(mwks.map(w=>w.date)).size;
  document.getElementById('s-exs').textContent  = mwks.reduce((s,w) => s+w.exercisesDone, 0);
  document.getElementById('s-reps').textContent = mwks.reduce((s,w) => s+w.totalReps, 0);
  const weeks = [1,2,3,4].map(n => ({n, days:new Set(), exs:0, reps:0}));
  mwks.forEach(w => { const wk=weeks[weekOfMonth(w.date)-1]; wk.days.add(w.date); wk.exs+=w.exercisesDone; wk.reps+=w.totalReps; });
  document.getElementById('week-tbody').innerHTML = weeks.map(w =>
    `<tr><td>Semana ${w.n}</td><td>${w.days.size}</td><td>${w.exs}</td><td>${w.reps}</td></tr>`).join('');
  const hist = document.getElementById('history-list');
  const recent = [...all].reverse().slice(0,12);
  if (!recent.length) { hist.innerHTML='<div class="empty-state">Nenhum treino registrado ainda</div>'; return; }
  hist.innerHTML = recent.map(w =>
    `<div class="history-item">
       <div class="history-date">${formatShort(w.date)}</div>
       <div class="history-badge">${w.type}</div>
       <div class="history-meta">${w.exercisesDone} ex &middot; ${w.totalReps} reps</div>
     </div>`).join('');
}

// ═══════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
renderMain();
</script>
</body>
</html>
